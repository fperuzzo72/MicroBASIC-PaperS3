; MicroBASIC-PaperS3 -- M5Stack PaperS3 (official), ESP32-S3R8.
;
; Hardware comes from freeink-sdk's M5PAPERS3 profile (960x540 raw-parallel
; EPD over the S3's LCD/i80 peripheral, GT911 touch, BM8563 RTC, SPI SD).
; Pin evidence and the CONFIRMED/PENDING breakdown live in
; freeink-sdk/docs/m5papers3-support.md -- read it before touching any pin.
;
;   pio run -e m5papers3 -t upload

[platformio]
default_envs = m5papers3
build_cache_dir = .cache

[env:m5papers3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-devkitm-1
board_build.mcu = esp32s3
framework = arduino
; The platform declares framework-arduinoespressif32 as optional and resolves it
; by URL, so it does not auto-install when an older registry-owned copy of the
; same package name is already in ~/.platformio/packages -- FRAMEWORK_DIR comes
; back None and the build dies in arduino.py with a bare TypeError. Pinning the
; exact URI the platform expects makes resolution explicit and reproducible.
platform_packages =
  espressif/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32/releases/download/3.3.7/esp32-core-3.3.7.tar.xz
monitor_speed = 115200
upload_speed = 921600

board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
; Octal PSRAM -- required by this device. 8MB, which is why SCREEN 4 (graphics)
; is finally viable here; the X4 had 380KB total and no PSRAM at all.
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 6553600
board_upload.offset_address = 0x10000

build_unflags =
  -std=gnu++11

build_flags =
  -std=gnu++17
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -DFREEINK_DEVICE_M5PAPERS3=1
  -DFREEINK_LGFX_EPD_CONFIG=m5PaperS3LgfxConfig
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DUSE_UTF8_LONG_NAMES=1
  -DCORE_DEBUG_LEVEL=0
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2

; Milestone 1 is hardware bring-up: prove display + touch + SD on the real
; panel before porting any MicroBASIC feature. The X4 sources sit in
; port-staging/ and move into src/ one at a time as each is ported.
build_src_filter =
  +<*>

lib_deps =
  BatteryMonitor=symlink://../freeink-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://../freeink-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://../freeink-sdk/libs/display/FreeInkDisplay
  SDCardManager=symlink://../freeink-sdk/libs/hardware/SDCardManager
  BoardConfig=symlink://../freeink-sdk/libs/hardware/BoardConfig
  XteinkDetect=symlink://../freeink-sdk/libs/hardware/XteinkDetect
  PowerManager=symlink://../freeink-sdk/libs/hardware/PowerManager
  Rtc=symlink://../freeink-sdk/libs/hardware/Rtc
  Imu=symlink://../freeink-sdk/libs/hardware/Imu
  ; Pinned to exactly the version crosspoint-reader-m5papers3 builds against
  ; (that firmware is proven to drive this panel). Left unpinned, PlatformIO
  ; resolved 0.2.27 -- one release newer than cpr's 0.2.26 -- for the initial
  ; bring-up, an unconfirmed variable in the display-never-updates failure.
  m5stack/M5GFX @ 0.2.26

lib_ignore =
  BLE
